name: Refresh pnpm lockfile for WebHID PoC

on:
  push:
    branches:
      - feat/webhid-readonly-poc
    paths:
      - package.json
      - .github/workflows/refresh-webhid-poc-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webhid-readonly-poc

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile for WebHID PoC"
          git push origin HEAD:feat/webhid-readonly-poc
