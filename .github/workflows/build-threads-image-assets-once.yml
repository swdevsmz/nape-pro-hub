name: Build Threads image assets once

on:
  push:
    branches:
      - main
    paths:
      - ".threads-upload/keymap.b64"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode Threads image assets
        run: |
          set -euo pipefail
          mkdir -p docs/threads-assets/2026-09-12-nape-pro-vertical-setup
          cat .threads-upload/photo.part*.b64 | base64 -d > docs/threads-assets/2026-09-12-nape-pro-vertical-setup/nape-pro-vertical-setup.jpg
          base64 -d .threads-upload/keymap.b64 > docs/threads-assets/2026-09-12-nape-pro-vertical-setup/nape-pro-keymap.jpg
          file docs/threads-assets/2026-09-12-nape-pro-vertical-setup/*.jpg

      - name: Persist image assets and remove staging data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/threads-assets/2026-09-12-nape-pro-vertical-setup
          git rm -r .threads-upload
          git commit -m "assets: add Nape Pro Threads carousel images"
          git pull --rebase origin main
          git push origin HEAD:main
